name: Build VirtualSpace APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "12266719"
          packages: "ndk;27.0.12077973 cmake;3.28.0"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-action@v1
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install NDK toolchain
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          # Create cargo config for NDK linking
          mkdir -p ~/.cargo
          NDK_TOOLCHAIN="${ANDROID_SDK_ROOT}/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cat > ~/.cargo/config.toml << 'EOF'
          [target.aarch64-linux-android]
          linker = "aarch64-linux-android21-clang"
          ar = "llvm-ar"
          
          [target.armv7-linux-androideabi]
          linker = "armv7a-linux-androideabi21-clang"
          ar = "llvm-ar"
          EOF
          echo "PATH=$NDK_TOOLCHAIN:$PATH" >> $GITHUB_ENV

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: ${{ runner.os }}-rust-${{ hashFiles('native/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Rust library (arm64)
        working-directory: native
        run: cargo build --release --target aarch64-linux-android
        env:
          PATH: ${{ env.PATH }}

      - name: Build Rust library (arm32)
        working-directory: native
        run: cargo build --release --target armv7-linux-androideabi
        env:
          PATH: ${{ env.PATH }}

      - name: Copy Rust libraries to jniLibs
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          cp native/target/aarch64-linux-android/release/libvirtualspace.so app/src/main/jniLibs/arm64-v8a/ 2>/dev/null || true
          cp native/target/armv7-linux-androideabi/release/libvirtualspace.so app/src/main/jniLibs/armeabi-v7a/ 2>/dev/null || true

      - name: Build APK (Debug)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build APK (Release)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign Release APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "35.0.0"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VirtualSpace-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: VirtualSpace-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn

      - name: Upload Signed APK
        if: steps.sign_app.outputs.signedReleaseFile
        uses: actions/upload-artifact@v4
        with:
          name: VirtualSpace-signed
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
          if-no-files-found: warn

      - name: Create Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: VirtualSpace v${{ github.run_number }}
          body: |
            ## VirtualSpace Build v${{ github.run_number }}
            
            - **Target:** Android 9+ (API 28+)
            - **Architectures:** arm64-v8a, armeabi-v7a
            - **Features:**
              - APK/XAPK import and installation
              - Installed app cloning
              - 32/64-bit game support
              - GameGuardian compatibility mode
              - Built-in logcat capture
              - Modern Material Design 3 UI
            
            ### SHA-256
            Checksums available in release artifacts.
          files: |
            app/build/outputs/apk/release/app-release-unsigned.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
