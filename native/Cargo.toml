[package]
name = "virtualspace"
version = "1.0.0"
edition = "2021"
authors = ["RedClient231"]
description = "VirtualSpace Engine - Android app virtualization core"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
zip = { version = "0.6", default-features = false, features = ["deflate"] }
quick-xml = { version = "0.31", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
log = "0.4"
android_logger = "0.15"
jni = { version = "0.21", features = ["invocation"] }
once_cell = "1"
parking_lot = "0.12"
thiserror = "1"
anyhow = "1"
memmap2 = { version = "0.9", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "0.8", features = ["bitmap", "native_window"] }
ndk-sys = "0.5"
jni = { version = "0.21", features = ["invocation"] }

[features]
default = ["memmap2"]
debug = ["memmap2"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 2
