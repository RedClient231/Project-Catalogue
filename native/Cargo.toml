[package]
name = "virtualspace"
version = "1.0.0"
edition = "2021"
authors = ["RedClient231"]
description = "VirtualSpace Engine - Android app virtualization core"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
quick-xml = { version = "0.37.2", features = ["serialize"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
libc = "0.2.171"
log = "0.4.27"
android_logger = "0.15.6"
jni = { version = "0.21.1", features = ["invocation"] }
once_cell = "1.21.3"
parking_lot = "0.12.3"
thiserror = "2.0.12"
anyhow = "1.0.97"
memmap2 = { version = "0.9.5", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "0.10.0", features = ["bitmap", "native_window"] }
ndk-sys = "0.6.0"
jni = { version = "0.21.1", features = ["invocation"] }

[features]
default = ["memmap2"]
debug = ["memmap2"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 2
