[package]
name = "virtualspace"
version = "1.0.0"
edition = "2021"
authors = ["RedClient231"]
description = "VirtualSpace Engine - Android app virtualization core"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
log = "0.4"
android_logger = "0.15"
jni = "0.21"
once_cell = "1"
parking_lot = "0.12"
thiserror = "1"
anyhow = "1"
memmap2 = "0.9"

[target.'cfg(target_os = "android")'.dependencies]
ndk = "0.9"
ndk-sys = "0.6"

[features]
default = []
debug = []

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 2
